name: Examples

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - basic
          - node-test
          - bdd
          - ecommerce-bdd
          - cucumber
          - contract
          - async-jobs
          - performance
          - data-driven
          - jest
          - vitest
          - mocha
          - typescript
          - ai
          - mock-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and test ${{ matrix.example }}
        run: cd ${{ matrix.example }} && npm install --no-audit --no-fund && npm test
